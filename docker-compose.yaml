version: "3.9"

services:

  zookeeper:
   image: confluentinc/cp-zookeeper:latest
   ports:
     - "2111:2111"
   environment:
     ZOOKEEPER_CONTAINER_IP: 192.168.0.122
     ZOOKEEPER_CLIENT_PORT: 2111
     ZOOKEEPER_TICK_TIME: 2000

  kafka-0:
    image: confluentinc/cp-kafka:7.0.1
    network_mode: host
    depends_on:
      - zookeeper
    environment:
      KAFKA_SCHEMA_REGISTRY_URL: "192.168.0.122:8086"
      KAFKA_BROKER_ID: 0
      KAFKA_ZOOKEEPER_CONNECT: 192.168.0.122:2111
      KAFKA_LISTENERS: PLAINTEXT://192.168.0.122:9092,EXTERNAL://192.168.0.122:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.0.122:9092,EXTERNAL://192.168.0.122:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  kafka-1:
    image: confluentinc/cp-kafka:7.0.1
    network_mode: host
    depends_on:
      - kafka-0
    environment:
      KAFKA_SCHEMA_REGISTRY_URL: "192.168.0.122:8086"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 192.168.0.122:2111
      KAFKA_LISTENERS: PLAINTEXT://192.168.0.122:9094,EXTERNAL://192.168.0.122:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.0.122:9094,EXTERNAL://192.168.0.122:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  kafka-2:
    image: confluentinc/cp-kafka:7.0.1
    network_mode: host
    depends_on:
      - kafka-1
    environment:
      KAFKA_SCHEMA_REGISTRY_URL: "192.168.0.122:8086"
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: 192.168.0.122:2111
      KAFKA_LISTENERS: PLAINTEXT://192.168.0.122:9096,EXTERNAL://192.168.0.122:9097
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.0.122:9096,EXTERNAL://192.168.0.122:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  ui:
    image: provectuslabs/kafka-ui:latest
    network_mode: host
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: 192.168.0.122:9092,192.168.0.122:9094,192.168.0.122:9096
      KAFKA_CLUSTERS_0_NAME: zoo
      KAFKA_CLUSTERS_0_ZOOKEEPER: 192.168.0.122:2111 
  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
    network_mode: host
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://192.168.0.122:9092,PLAINTEXT://192.168.0.122:9094,PLAINTEXT://192.168.0.122:9096
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://192.168.0.122:8086